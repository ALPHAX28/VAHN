name: VAHN CI/CD Pipeline & Automated Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # STAGE 1: COMPREHENSIVE CI CHECKS (FRONTEND, BACKEND & DB MIGRATIONS)
  # ============================================================
  ci-checks:
    name: Frontend, Backend & Migration CI Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vahn_user
          POSTGRES_PASSWORD: vahn_pass
          POSTGRES_DB: vahn_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Node.js / Next.js Checks
      # ------------------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build Verification
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

      # ------------------------------------------------------------
      # Python / FastAPI / Alembic Checks
      # ------------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Bytecode Compilation Check
        working-directory: ./backend
        run: python -m compileall .

      - name: Test Alembic Migrations Against Clean Database
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+pg8000://vahn_user:vahn_pass@127.0.0.1:5432/vahn_test_db
          JWT_SECRET: test_secret_key_ci_cd_12345
        run: |
          echo "Testing Alembic migrations (upgrade head)..."
          python -m alembic upgrade head
          echo "✔ Alembic migrations applied cleanly with zero errors!"

      # ------------------------------------------------------------
      # Email Alerts: CI Checks Pass / Fail
      # ------------------------------------------------------------
      - name: Send Email — CI Checks Passed
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ [VAHN CI] (${{ github.ref_name }}) Checks & Migrations Passed (${{ github.sha }})"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #e5e7eb; border-radius: 8px;">
              <h2 style="color: #16a34a; margin-top: 0;">✔ CI Verification Succeeded (${{ github.ref_name }})</h2>
              <p>All automated checks passed successfully for commit <strong>${{ github.sha }}</strong> on branch <strong>${{ github.ref_name }}</strong>.</p>
              <ul style="line-height: 1.6;">
                <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                <li><strong>Author:</strong> ${{ github.actor }}</li>
                <li><strong>Commit Message:</strong> ${{ github.event.head_commit.message }}</li>
                <li><strong>Frontend TypeScript:</strong> Passed (0 errors)</li>
                <li><strong>Next.js Build:</strong> Standalone bundle generated</li>
                <li><strong>Backend Compilation:</strong> Verified</li>
                <li><strong>Alembic Test Migrations:</strong> Applied cleanly on test database</li>
              </ul>
              <p style="color: #4b5563; font-size: 13px;">Proceeding to deployment...</p>
            </div>

      - name: Send Email — CI Checks Failed
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ [VAHN CI] (${{ github.ref_name }}) Checks Failed for Commit ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #fecaca; border-radius: 8px; background-color: #fef2f2;">
              <h2 style="color: #dc2626; margin-top: 0;">✘ CI Verification Failed</h2>
              <p>Automated checks failed for commit <strong>${{ github.sha }}</strong> on branch <strong>${{ github.ref_name }}</strong>. <strong>Deployment has been aborted.</strong></p>
              <ul style="line-height: 1.6;">
                <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
                <li><strong>Author:</strong> ${{ github.actor }}</li>
                <li><strong>Commit Message:</strong> ${{ github.event.head_commit.message }}</li>
              </ul>
              <p style="color: #991b1b; font-size: 13px;">Please check GitHub Actions logs to inspect the failure details.</p>
            </div>

  # ============================================================
  # STAGE 2A: PRODUCTION DEPLOYMENT (MAIN BRANCH)
  # ============================================================
  deploy-prod:
    name: Deploy to Production (vahnsports.com)
    needs: ci-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Send Email — Prod Deployment Started
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚀 [VAHN Prod Deploy] Started for Commit ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #e5e7eb; border-radius: 8px;">
              <h2 style="color: #2563eb; margin-top: 0;">🚀 Production Deployment In Progress</h2>
              <p>Deploying commit <strong>${{ github.sha }}</strong> to production (https://vahnsports.com)...</p>
            </div>

      - name: Deploy Production Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/VAHN
            git fetch origin
            git checkout main
            git pull origin main

            if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
              echo "${{ secrets.PROD_ENV_FILE }}" > backend/.env
            fi

            # Deploy production compose stack
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            sleep 6
            docker exec vahn-backend-prod python -m alembic upgrade head
            docker exec vahn-caddy-prod caddy reload --config /etc/caddy/Caddyfile || true

      - name: Send Email — Prod Deployment Succeeded
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🎉 [VAHN Prod Deploy] Succeeded — Store is Live!"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #bbf7d0; border-radius: 8px; background-color: #f0fdf4;">
              <h2 style="color: #15803d; margin-top: 0;">🎉 Production Deployment Succeeded!</h2>
              <p>Your store is live at <a href="https://vahnsports.com" style="color: #2563eb; font-weight: bold;">https://vahnsports.com</a>.</p>
              <ul style="line-height: 1.6;">
                <li><strong>Commit:</strong> ${{ github.sha }}</li>
                <li><strong>Environment:</strong> Production</li>
                <li><strong>Database:</strong> vahn_db (Alembic Upgraded)</li>
              </ul>
            </div>

  # ============================================================
  # STAGE 2B: DEVELOPMENT DEPLOYMENT (DEV BRANCH)
  # ============================================================
  deploy-dev:
    name: Deploy to Development (dev.vahnsports.com)
    needs: ci-checks
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Send Email — Dev Deployment Started
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🛠 [VAHN Dev Deploy] Started for Commit ${{ github.sha }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #e5e7eb; border-radius: 8px;">
              <h2 style="color: #6366f1; margin-top: 0;">🛠 Development Deployment In Progress</h2>
              <p>Deploying commit <strong>${{ github.sha }}</strong> to dev environment (https://dev.vahnsports.com)...</p>
            </div>

      - name: Deploy Development Stack via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/VAHN
            git fetch origin
            git checkout dev
            git pull origin dev

            # Setup dev .env if not present
            if [ ! -f backend/.env.dev ]; then
              cp backend/.env.dev.example backend/.env.dev
            fi

            # Deploy dev compose stack
            docker compose -f docker-compose.dev.yml up -d --build --remove-orphans
            sleep 6
            docker exec vahn-backend-dev python -m alembic upgrade head
            docker exec -i vahn-caddy-prod caddy reload --adapter caddyfile < caddy/Caddyfile || docker restart vahn-caddy-prod || true

      - name: Send Email — Dev Deployment Succeeded
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'email-smtp.ap-south-1.amazonaws.com' }}
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🎉 [VAHN Dev Deploy] Succeeded — https://dev.vahnsports.com"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VAHN CI/CD <noreply@vahnsports.com>"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 20px; color: #111; max-width: 600px; border: 1px solid #c7d2fe; border-radius: 8px; background-color: #eef2ff;">
              <h2 style="color: #4338ca; margin-top: 0;">🎉 Development Deployment Succeeded!</h2>
              <p>Your dev environment is live at <a href="https://dev.vahnsports.com" style="color: #2563eb; font-weight: bold;">https://dev.vahnsports.com</a>.</p>
              <ul style="line-height: 1.6;">
                <li><strong>Commit:</strong> ${{ github.sha }}</li>
                <li><strong>Environment:</strong> Development (Isolated)</li>
                <li><strong>Database:</strong> vahn_dev_db (Alembic Upgraded)</li>
                <li><strong>S3 Media Prefix:</strong> dev/</li>
              </ul>
            </div>
