name: vahn-dev

services:
  db-dev:
    image: postgres:16-alpine
    container_name: vahn-postgres-db-dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vahn_dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vahn_dev_pass}
      POSTGRES_DB: ${DB_NAME:-vahn_dev_db}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vahn_dev_user} -d ${DB_NAME:-vahn_dev_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vahn-prod-network

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vahn-backend-dev
    restart: always
    depends_on:
      db-dev:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+pg8000://${DB_USER:-vahn_dev_user}:${DB_PASSWORD:-vahn_dev_pass}@db-dev:5432/${DB_NAME:-vahn_dev_db}
      - HOST=0.0.0.0
      - PORT=8000
      - S3_FOLDER_PREFIX=dev
    env_file:
      - ./backend/.env.dev
    networks:
      - vahn-prod-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vahn-frontend-dev
    restart: always
    depends_on:
      - backend-dev
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - INTERNAL_API_URL=http://backend-dev:8000/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - vahn-prod-network

  keepalive-dev:
    image: alpine:3.19
    container_name: vahn-keepalive-dev
    restart: always
    depends_on:
      - frontend-dev
      - backend-dev
    entrypoint: >
      sh -c "
        apk add --no-cache curl > /dev/null 2>&1;
        echo 'VAHN Dev 24/7 Hot Warmup Service Active';
        while true; do
          sleep 180;
          curl -s -o /dev/null http://frontend-dev:3000/api/keep-alive || true;
        done
      "
    networks:
      - vahn-prod-network

  vpn:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: vahn-vpn
    restart: always
    environment:
      - WG_HOST=65.2.203.191
      - PASSWORD=${VPN_PASSWORD:-vahn_admin_vpn_2026}
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1, 8.8.8.8
      - WG_ALLOWED_IPS=10.8.0.0/24, 65.2.203.191/32
    volumes:
      - vahn_wireguard_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - vahn-prod-network

volumes:
  postgres_dev_data:
    name: vahn_db_dev_data
  vahn_wireguard_data:
    name: vahn_wireguard_data

networks:
  vahn-prod-network:
    external: true
    name: vahn_prod_network
