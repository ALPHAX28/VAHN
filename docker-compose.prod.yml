name: vahn-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: vahn-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - vahn-network

  db:
    image: postgres:16-alpine
    container_name: vahn-postgres-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-vahn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vahn_pass}
      POSTGRES_DB: ${DB_NAME:-vahn_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vahn_user} -d ${DB_NAME:-vahn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vahn-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vahn-backend-prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+pg8000://${DB_USER:-vahn_user}:${DB_PASSWORD:-vahn_pass}@db:5432/${DB_NAME:-vahn_db}
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - ./backend/.env
    networks:
      - vahn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vahn-frontend-prod
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - INTERNAL_API_URL=http://backend:8000/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - vahn-network

  keepalive:
    image: alpine:3.19
    container_name: vahn-keepalive-prod
    restart: always
    depends_on:
      - frontend
      - backend
    entrypoint: >
      sh -c "
        apk add --no-cache curl > /dev/null 2>&1;
        echo 'VAHN 24/7 Hot Warmup Service Active';
        while true; do
          sleep 180;
          curl -s -o /dev/null http://frontend:3000/api/keep-alive || true;
        done
      "
    networks:
      - vahn-network

volumes:
  postgres_prod_data:
    name: vahn_db_prod_data
  caddy_data:
    name: vahn_caddy_data
  caddy_config:
    name: vahn_caddy_config

networks:
  vahn-network:
    name: vahn_prod_network
